<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#181b22; --ink-soft:#5a6072;
    --line:#e3e6ec; --brand:#1f5fd6; --brand-soft:#eaf1ff;
    --ok:#1a7f4e; --ok-bg:#e9f9f1;
    --warn:#b45309; --warn-bg:#fff4e5;
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12141b; --card:#1b1e28; --ink:#eef0f5; --ink-soft:#a4a9bc;
      --line:#2a2e3c; --brand:#7ea2ff; --brand-soft:#1c2740;
      --ok:#4fd493; --ok-bg:#0f2a1e;
      --warn:#e8a54b; --warn-bg:#2d1f0c;
    }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  header{ background:var(--card); border-bottom:1px solid var(--line); padding:36px 24px 26px; text-align:center; }
  header .kicker{ font-size:0.78rem; font-weight:700; color:var(--brand); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px; }
  header h1{ margin:0 0 8px; font-size:1.5rem; }
  header p{ margin:0; color:var(--ink-soft); font-size:0.92rem; }
  .wrap{ max-width:800px; margin:0 auto; padding:28px 20px 80px; }

  .search{
    width:100%; padding:12px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:0.95rem; margin-bottom:24px; outline:none;
  }
  .search:focus{ border-color:var(--brand); }

  .quick-links{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:32px; }
  .quick-link{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;
    text-decoration:none; color:var(--ink); font-size:0.85rem; font-weight:600; display:flex; align-items:center; gap:8px;
  }
  .quick-link .ico{ font-size:1.1rem; }

  .group{ margin-bottom:34px; }
  .group-head{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .group-head h2{ font-size:1.02rem; margin:0; }
  .group-head .count{ font-size:0.72rem; color:var(--ink-soft); background:var(--brand-soft); padding:2px 9px; border-radius:999px; font-weight:700; }

  .ticket{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:8px; overflow:hidden;
  }
  .ticket summary{
    padding:14px 44px 14px 16px; cursor:pointer; font-weight:600; font-size:0.92rem; list-style:none; position:relative;
    display:flex; align-items:baseline; gap:10px;
  }
  .ticket summary::-webkit-details-marker{ display:none; }
  .ticket summary::after{ content:"+"; position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:1.15rem; }
  .ticket[open] summary::after{ content:"–"; }
  .ticket .tag{ font-size:0.66rem; font-weight:800; padding:2px 8px; border-radius:999px; flex:none; }
  .ticket .tag.miriopic{ background:var(--brand-soft); color:var(--brand); }
  .ticket .tag.class4h{ background:var(--warn-bg); color:var(--warn); }
  .ticket-body{ padding:0 16px 16px 16px; }
  .ticket-body .step{
    display:flex; gap:10px; align-items:flex-start; padding:8px 0; font-size:0.88rem; color:var(--ink-soft);
  }
  .ticket-body .step .n{ flex:none; width:20px; height:20px; border-radius:50%; background:var(--brand-soft); color:var(--brand); font-size:0.72rem; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .ticket-body p.plain{ margin:0; font-size:0.88rem; color:var(--ink-soft); line-height:1.7; }
  .resolved-note{ margin-top:10px; font-size:0.78rem; color:var(--ok); background:var(--ok-bg); padding:6px 10px; border-radius:8px; display:inline-block; }

  .contact-box{
    background:var(--brand-soft); border-radius:16px; padding:22px 24px; margin-top:40px; text-align:center;
  }
  .contact-box h3{ margin:0 0 8px; font-size:1rem; }
  .contact-box p{ margin:0 0 14px; font-size:0.88rem; color:var(--ink-soft); }
  .contact-box a.btn{
    display:inline-block; background:var(--brand); color:#fff; text-decoration:none; font-weight:700;
    font-size:0.86rem; padding:10px 22px; border-radius:999px;
  }

  .no-result{ text-align:center; color:var(--ink-soft); padding:40px 0; display:none; font-size:0.9rem; }
  .hidden{ display:none !important; }
</style>
</head>

const contentEl = document.getElementById('content');
const searchBox = document.getElementById('searchBox');
const noResult = document.getElementById('noResult');

function tagLabel(tag){ return tag === 'class4h' ? '4시간오픽' : '미리오픽'; }

GROUPS.forEach(group => {
  const block = document.createElement('div');
  block.className = 'group';
  block.dataset.group = group.id;
  block.id = group.id;

  const head = document.createElement('div');
  head.className = 'group-head';
  head.innerHTML = `<h2>${group.icon} ${group.title}</h2><span class="count">${group.items.length}건</span>`;
  block.appendChild(head);

  group.items.forEach(item => {
    const det = document.createElement('details');
    det.className = 'ticket';
    const sum = document.createElement('summary');
    sum.innerHTML = `<span class="tag ${item.tag}">${tagLabel(item.tag)}</span><span>${item.q}</span>`;
    const body = document.createElement('div');
    body.className = 'ticket-body';
    if (item.steps) {
      body.innerHTML = item.steps.map((s, i) => `<div class="step"><span class="n">${i+1}</span><span>${s}</span></div>`).join('');
    } else {
      body.innerHTML = `<p class="plain">${item.a}</p>`;
    }
    det.appendChild(sum);
    det.appendChild(body);
    block.appendChild(det);
  });

  contentEl.appendChild(block);
});

searchBox.addEventListener('input', () => {
  const q = searchBox.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('.group').forEach(block => {
    let blockHasMatch = false;
    block.querySelectorAll('.ticket').forEach(t => {
      const match = !q || t.textContent.toLowerCase().includes(q);
      t.classList.toggle('hidden', !match);
      if (match) blockHasMatch = true;
    });
    block.classList.toggle('hidden', !blockHasMatch);
    if (blockHasMatch) anyVisible = true;
  });
  noResult.style.display = (q && !anyVisible) ? 'block' : 'none';
});
</script>

</body>
</html>
